<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Register - CreatorDigitalPro</title>

    <link rel="stylesheet" href="../assets/css/auth.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/CreatorDigitalPro/assets/css/demo-guard.css">
</head>

  <body>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-logo">CreatorDigitalPro</div>

        <h1>Buat Akun</h1>

        <p>Mulai menggunakan CreatorDigitalPro.</p>

        <form id="registerForm">
          <input type="text" placeholder="Nama Lengkap" required />

          <input type="email" placeholder="Email" required />

          <input type="password" placeholder="Password" required />

          <button type="submit">Daftar</button>
        </form>

        <div class="auth-links">
          Sudah punya akun?

          <a href="login.html"> Masuk </a>
        </div>
      </div>
    </div>
      <script src="../config/settings.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="/CreatorDigitalPro/assets/js/demo-guard.js"></script>
</body>
</html>
