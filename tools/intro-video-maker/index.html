<!doctype html>

<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CreatorDigitalPro Intro Studio</title>

    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="app-wrapper">
      <!-- ================================================= -->
      <!-- SIDEBAR -->
      <!-- ================================================= -->

      <aside class="sidebar">
        <div class="studio-brand">
          <h2>CreatorDigitalPro</h2>

          <span>INTRO VIDEO STUDIO</span>
        </div>

        <div class="editor-card">
          <div class="editor-badge">INTRO GENERATOR</div>

          <h1>Intro Studio</h1>

          <p>Professional Intro Video Maker</p>
        </div>

        <!-- ===================================== -->
        <!-- TEMPLATE -->
        <!-- ===================================== -->

        <div class="form-group">
          <label>Template Intro</label>

          <select id="templateSelect">
            <option value="modern">Modern</option>

            <option value="gaming">Gaming</option>

            <option value="corporate">Corporate</option>

            <option value="neon">Neon</option>

            <option value="cinematic">Cinematic</option>
          </select>
        </div>

        <!-- ===================================== -->
        <!-- TITLE -->
        <!-- ===================================== -->

        <div class="form-group">
          <label>Judul Intro</label>

          <textarea id="titleInput" rows="4">WELCOME TO MY CHANNEL</textarea>
        </div>

        <!-- ===================================== -->
        <!-- SUBTITLE -->
        <!-- ===================================== -->

        <div class="form-group">
          <label>Sub Judul</label>

          <textarea id="subtitleInput" rows="3">
CreatorDigitalPro Studio</textarea
          >
        </div>

        <!-- ===================================== -->
        <!-- LOGO -->
        <!-- ===================================== -->

        <div class="form-group">
          <label>Upload Logo</label>

          <input type="file" id="logoInput" accept="image/*" />
        </div>

        <!-- ===================================== -->
        <!-- BACKGROUND -->
        <!-- ===================================== -->

        <div class="form-group">
          <label>Upload Background</label>

          <input type="file" id="bgInput" accept="image/*" />
        </div>

        <!-- ===================================== -->
        <!-- MUSIC -->
        <!-- ===================================== -->

        <div class="form-group">
          <label>Upload Musik</label>

          <input type="file" id="musicInput" accept="audio/*" />
        </div>

        <!-- ===================================== -->
        <!-- LOGO SIZE -->
        <!-- ===================================== -->

        <div class="form-group">
          <label>Ukuran Logo</label>

          <input type="range" id="logoSize" min="50" max="500" value="220" />
        </div>

        <!-- ===================================== -->
        <!-- TITLE SIZE -->
        <!-- ===================================== -->

        <div class="form-group">
          <label>Ukuran Judul</label>

          <input type="range" id="titleSize" min="40" max="180" value="120" />
        </div>

        <!-- ===================================== -->
        <!-- SUBTITLE SIZE -->
        <!-- ===================================== -->

        <div class="form-group">
          <label>Ukuran Subtitle</label>

          <input type="range" id="subtitleSize" min="20" max="60" value="42" />
        </div>

        <!-- ===================================== -->
        <!-- COLOR -->
        <!-- ===================================== -->

        <div class="form-group">
          <label>Warna Judul</label>

          <input type="color" id="titleColor" value="#ffffff" />

          <label>Warna Subtitle</label>

          <input type="color" id="subtitleColor" value="#00d4ff" />
        </div>

        <!-- ===================================== -->
        <!-- ACTION -->
        <!-- ===================================== -->

        <div class="action-buttons">
          <button id="playBtn" class="btn primary">▶ Play</button>

          <button id="pauseBtn" class="btn secondary">⏸ Pause</button>

          <button id="resetBtn" class="btn secondary">↺ Reset</button>
        </div>

        <!-- ===================================== -->
        <!-- PROJECT -->
        <!-- ===================================== -->

        <div class="action-buttons">
          <button id="saveProjectBtn" class="btn secondary">
            💾 Simpan Project
          </button>

          <button id="loadProjectBtn" class="btn secondary">
            📂 Buka Project
          </button>
        </div>

        <!-- ===================================== -->
        <!-- EXPORT -->
        <!-- ===================================== -->

        <div class="action-buttons">
          <button id="exportPngBtn" class="btn success">📸 Export PNG</button>

          <button id="exportWebmBtn" class="btn danger">🎬 Export WEBM</button>
        </div>
      </aside>

      <!-- ================================================= -->
      <!-- WORKSPACE -->
      <!-- ================================================= -->

      <main class="workspace">
        <!-- ===================================== -->
        <!-- PREVIEW -->
        <!-- ===================================== -->

        <section class="preview-panel">
          <div class="preview-stage">
            <div class="canvas-wrapper">
              <canvas id="introCanvas" width="1920" height="1080"> </canvas>
            </div>
          </div>
        </section>

        <!-- ===================================== -->
        <!-- TIMELINE -->
        <!-- ===================================== -->

        <section class="timeline-panel">
          <div class="timeline-header">
            <h3>Timeline</h3>

            <span id="timelineLabel"> 0.0s / 10.0s </span>
          </div>

          <input
            type="range"
            id="timelineSlider"
            min="0"
            max="10"
            step="0.1"
            value="0"
          />

          <div class="timeline-scale">
            <span>0s</span>
            <span>2s</span>
            <span>4s</span>
            <span>6s</span>
            <span>8s</span>
            <span>10s</span>
          </div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
    <script src="../../assets/js/license-guard.js"></script>
</body>
</html>
